services:
  - type: web
    name: povishield-backend
    env: python
    buildCommand: pip install -r requirements.txt && (make || true)
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POVISHIELD_ALLOW_REMOTE
        value: "1"
      - key: POVISHIELD_TOTAL_SYSCALLS
        value: "385"
